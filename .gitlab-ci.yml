workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true

variables:
  TestSettings__BaseUrl: "https://www.zigwheels.com/"
  TestSettings__Headless: "true"
  SELENIUM_REMOTE_URL: "http://selenium-chrome:4444/wd/hub"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

stages:
  - validate
  - test

cache:
  key:
    files:
      - "**/*.csproj"
  paths:
    - .nuget/packages/

validate_project:
  stage: validate
  script:
    - dotnet restore
    - dotnet build --no-restore -c Release

selenium_tests:
  stage: test
  services:
    - name: selenium/standalone-chrome:4.40.0
      alias: selenium-chrome
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - |
      for attempt in $(seq 1 30); do
        if curl --fail --silent "http://selenium-chrome:4444/status" | grep -q '"ready": true'; then
          echo "Selenium Grid is ready."
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo "Selenium Grid did not become ready."
          exit 1
        fi
        echo "Waiting for Selenium Grid: $attempt/30"
        sleep 2
      done
  script:
    - dotnet test --no-restore -c Release --logger "junit;LogFilePath=test-results/{assembly}.xml"
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit:
        - "**/test-results/*.xml"
    paths:
      - "**/test-results/"
      - "**/allure-results/"
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'